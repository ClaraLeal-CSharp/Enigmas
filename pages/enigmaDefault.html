<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nível 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../style/enigmas.css">

</head>
<body>

  <!--
    IMAGEM CENTRAL
    Troque src pela sua imagem. Exemplo:
      <img src="imagens/nivel1.jpg" alt="" class="enigma-img">

    Se a imagem for clicável (leva ao próximo nível):
      <a href="nivel-2.html"><img src="imagens/nivel1.jpg" alt="" class="enigma-img"></a>
  -->
  <img src="sua-imagem.jpg" alt="" class="enigma-img" />

  <!--
    TEXTO ABAIXO
    Pode ser uma dica, frase enigmática, ou o título do nível.

    Se o texto for clicável:
      <a href="..." class="enigma-text">texto aqui</a>
  -->
  <p class="enigma-text">Substitua este texto pela informação do enigma.</p>

</body>
</html>
